<!DOCTYPE html>
<html lang="en">
<head>
    <title>ClickFunction</title>
    <style>
        button {
            padding: 10px;
            size : 50px;
            background-color: rgb(255, 0, 0);
            color: white;
            border-radius: 50px;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: rgb(255, 247, 0);
        }
    </style>
</head>
<body>
    <button onclick="handleclick()">Click Me</button>
    <script>
        function handleclick() {
            console.log("System Hacked Boiii");
        }
    </script>
</body>
</html>
