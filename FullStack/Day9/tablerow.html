<!DOCTYPE html>
<html>
<head>
    <title>Rowspan and Colspan</title>
</head>
<body>
<table border="10">
    <tr>
        <th>Header</th>
        <th>Header</th>
        <th>Header</th>
        <th>Header</th>
    </tr>
    <tr>
        <td rowspan="4" align = "center">span<br>rows</td>
        <td colspan="3" align = "center">span columns</td>
    </tr>
    <tr>
        <td colspan="2" align = "center">span columns</td>
        <td rowspan="3" align = "center" >span<br>both</td>
    </tr>
    <tr>
        <td rowspan="2" align = "center">span<br>rows</td>
        <td>span columns</td>
    </tr>
    <tr>
        <td align = "center">span<br>both</td>
    </tr>
</table>
<br><br>
</body>
</html>
